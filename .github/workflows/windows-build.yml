name: Windows build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements-dev.txt
      - name: Install frontend dependencies
        run: npm ci
      - name: Install backend test dependencies
        run: python -m pip install pytest
      - name: Test frontend
        run: npm run test:frontend
      - name: Test backend utilities
        run: npm run test:backend
        env:
          SPLTR_TEST_PYTHON: python
      - name: Prepare portable runtime resources
        run: npm run prepare:windows
      - name: Build NSIS installer
        run: npm run tauri build
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SPLTR-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Publish easy-download release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "NSIS installer was not produced."
          }

          gh release view v0.1.0 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v0.1.0 $installer.FullName --clobber --repo $env:GITHUB_REPOSITORY
            gh release edit v0.1.0 --latest --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create v0.1.0 $installer.FullName `
              --target $env:GITHUB_SHA `
              --title "SPLTR v0.1.0" `
              --notes "Windows 10/11용 설치 파일입니다. 아래 EXE를 내려받아 실행하세요. Python, FFmpeg, AI 모델을 따로 설치할 필요가 없습니다. AI 모델은 첫 실행 시 자동으로 내려받습니다." `
              --latest `
              --repo $env:GITHUB_REPOSITORY
          }
