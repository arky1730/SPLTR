name: Windows build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements-dev.txt
      - name: Read app version
        id: app_version
        shell: pwsh
        run: |
          $version = (Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
      - name: Cache portable runtime downloads
        uses: actions/cache@v4
        with:
          path: build/downloads
          key: spltr-windows-runtime-python-3.12.10-ffmpeg-essentials-v1
      - name: Install frontend dependencies
        run: npm ci
      - name: Install backend test dependencies
        run: python -m pip install pytest
      - name: Test frontend
        run: npm run test:frontend
      - name: Test backend utilities
        run: npm run test:backend
        env:
          SPLTR_TEST_PYTHON: python
      - name: Prepare portable runtime resources
        run: npm run prepare:windows
      - name: Build NSIS installer
        run: npm run tauri build
      - name: Build portable ZIP
        shell: pwsh
        run: |
          $version = "${{ steps.app_version.outputs.version }}"
          $portableRoot = "release/SPLTR-portable"
          New-Item -ItemType Directory -Force -Path $portableRoot | Out-Null
          Copy-Item "src-tauri/target/release/spltr.exe" "$portableRoot/SPLTR.exe" -Force
          Copy-Item "src-tauri/resources/python" "$portableRoot/python" -Recurse -Force
          Copy-Item "src-tauri/resources/ffmpeg" "$portableRoot/ffmpeg" -Recurse -Force
          New-Item -ItemType Directory -Force -Path "$portableRoot/backend" | Out-Null
          Copy-Item "python/bootstrap.py" "$portableRoot/backend/bootstrap.py" -Force
          Copy-Item "python/requirements-runtime.txt" "$portableRoot/backend/requirements-runtime.txt" -Force
          Copy-Item "python/spltr_backend" "$portableRoot/backend/spltr_backend" -Recurse -Force
          Copy-Item "docs/PORTABLE.txt" "$portableRoot/README.txt" -Force
          tar.exe -a -c -f "release/SPLTR_${version}_x64-portable.zip" -C $portableRoot .
          if ($LASTEXITCODE -ne 0) { throw "Portable ZIP creation failed." }
      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: SPLTR-Windows-v${{ steps.app_version.outputs.version }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            release/*.zip
          if-no-files-found: error
      - name: Publish easy-download release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.app_version.outputs.version }}"
          $tag = "${{ steps.app_version.outputs.tag }}"
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          $portable = Get-Item "release/SPLTR_${version}_x64-portable.zip"
          if (-not $installer) {
            throw "NSIS installer was not produced."
          }

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer.FullName $portable.FullName --clobber --repo $env:GITHUB_REPOSITORY
            gh release edit $tag --title "SPLTR v$version" --latest --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $installer.FullName $portable.FullName `
              --target $env:GITHUB_SHA `
              --title "SPLTR v$version" `
              --notes "Windows 10/11용입니다. 설치형 EXE 또는 무설치 portable ZIP 중 하나를 받으세요. 첫 실행 시 AI 런타임과 모델을 자동으로 내려받으며, 오디오는 PC 밖으로 전송되지 않습니다." `
              --latest `
              --repo $env:GITHUB_REPOSITORY
          }
