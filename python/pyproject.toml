[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "spltr-backend"
version = "0.8.0"
description = "Local Demucs processing backend for SPLTR"
requires-python = ">=3.12"
dependencies = ["demucs==4.1.0", "numpy==1.26.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["spltr_backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["spltr_backend"]
