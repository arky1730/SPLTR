[package]
name = "spltr"
version = "0.9.0"
description = "Private, local AI vocal separation"
authors = ["SPLTR Contributors"]
edition = "2021"

[lib]
name = "spltr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
